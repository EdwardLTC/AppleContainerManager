<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="40" height="40" rx="8" fill="#F5F5F7"/>

    <!-- Shipping container body -->
    <rect x="7" y="13" width="26" height="18" rx="2.5" fill="#5A5C63"/>
    <rect x="7" y="13" width="26" height="18" rx="2.5" fill="url(#containerGradient)"/>

    <!-- Corrugation lines (container ridges) -->
    <line x1="11.5" y1="13" x2="11.5" y2="31" stroke="#40424A" stroke-width="1"/>
    <line x1="16" y1="13" x2="16" y2="31" stroke="#40424A" stroke-width="1"/>
    <line x1="20.5" y1="13" x2="20.5" y2="31" stroke="#40424A" stroke-width="1"/>
    <line x1="25" y1="13" x2="25" y2="31" stroke="#40424A" stroke-width="1"/>
    <line x1="29.5" y1="13" x2="29.5" y2="31" stroke="#40424A" stroke-width="1"/>

    <!-- Container door seam -->
    <rect x="7" y="21" width="26" height="1" fill="#33353B" opacity="0.6"/>

    <!-- Door handle / lock detail -->
    <rect x="18.5" y="24.5" width="3" height="4" rx="1" fill="#D8D9DC"/>

    <!-- Leaf / sprout accent evoking "Apple" ecosystem, growing from the container -->
    <g>
        <path d="M20 13 C20 9.5 22.2 7.4 25.3 6.8 C25.3 10 23.4 12.3 20 13 Z" fill="#3ECF6E"/>
        <path d="M20 13 C20 10.2 18.2 8.4 15.6 7.9 C15.6 10.8 17.2 12.6 20 13 Z" fill="#2FB85A"/>
        <path d="M20 13 L20 8.2" stroke="#1F8A44" stroke-width="0.8" stroke-linecap="round"/>
    </g>

    <defs>
        <linearGradient id="containerGradient" x1="7" y1="13" x2="33" y2="31" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6B6D75"/>
            <stop offset="1" stop-color="#4A4C53"/>
        </linearGradient>
    </defs>
</svg>